.big{font-size:30px;font-weight:850}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.progress{height:8px;background:#252b37;border-radius:20px;overflow:hidden;margin:8px 0}.bar{height:100%;background:var(--accent);border-radius:20px}
.subject{display:flex;justify-content:space-between;gap:8px}.subject b{font-size:14px}
button,input,select,textarea{font:inherit}button{cursor:pointer}.primary{border:0;background:var(--accent);color:#fff;padding:10px 13px;border-radius:11px}.secondary{border:1px solid var(--line);background:var(--card2);color:var(--text);padding:9px 11px;border-radius:10px}.danger{border:1px solid #6c2a38;background:#2b151b;color:#ff9bac;padding:9px 11px;border-radius:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}input,select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;width:100%}textarea{min-height:80px}
label{display:block;color:var(--muted);font-size:12px;margin:7px 0 4px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px 5px;border-bottom:1px solid var(--line);vertical-align:top}

.alert{border-left:3px solid var(--warn);padding-left:10px}.priority{border-left:3px solid var(--bad);padding-left:10px}
.task{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}
.task.done .tasktext{text-decoration:line-through;color:var(--muted)}
.chapter-card{background:var(--card2);border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}.chapter-head{width:100%;display:block;text-align:left;background:transparent;color:var(--text);border:0;padding:13px}.chapter-head:active{transform:scale(.995)}.chapter-tools{padding:0}.chapter-actions{display:flex;gap:7px;flex-wrap:wrap;padding:0 12px 12px}.chapter-actions button{min-height:40px}.chapter-body{padding:0 12px 10px;border-top:1px solid var(--line)}.chapter-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}.mini-stat{background:var(--card);border-radius:10px;padding:7px;font-size:11px}.mini-stat b{display:block;font-size:14px}.lecture-mini{padding:10px 0;border-bottom:1px solid var(--line)}.lecture-mini:last-child{border-bottom:0}.kpi{font-size:13px}.nowrap{white-space:nowrap}.scroll{overflow:auto}
details{background:var(--card2);border:1px solid var(--line);border-radius:12px;margin:7px 0;padding:8px}summary{cursor:pointer;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}
