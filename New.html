function actions(a){
  if(a==="newlecture"){showLectureEditor("");return}
  if(a==="today"){page="Today";render();return}
  if(a==="generate"){state.dailyTargets[todayISO()]=Math.ceil(requiredDaily());save();render();return}
  if(a==="leave"){var d=prompt("Status: Normal Day / Light Day / Half Leave / Full Leave",leaveType(todayISO()));if(d&&["Normal Day","Light Day","Half Leave","Full Leave"].includes(d)){state.leaves[todayISO()]=d;save();render()}return}
  if(a==="addmanual"){var el=document.getElementById("manualText"),x=el&&el.value.trim();if(x){state.manualTasks.push({id:uid(),date:todayISO(),text:x,done:false});save();render()}return}
  if(a==="savecredit"){state.externalCompleted.Physics=Math.max(0,Number(document.getElementById("physicsCredit").value)||0);save();render();return}
  if(a==="saveprofile"){state.profile.name=document.getElementById("pname").value.trim()||"Student";state.profile.class=document.getElementById("pclass").value.trim();state.profile.session=document.getElementById("psession").value.trim();state.profile.target_percentage=Number(document.getElementById("ptarget").value)||0;state.profile.deadline=document.getElementById("pdeadline").value||"2026-12-01";state.profile.school_exam_dates=document.getElementById("pexam").value;save();render();return}
  if(a==="saveleave"){var d=document.getElementById("ldate").value,t=document.getElementById("ltype").value;if(d){state.leaves[d]=t;save();render()}return}
  if(a==="clearleave"){var d=document.getElementById("ldate").value;if(d){delete state.leaves[d];save();render()}return}
  if(a==="savetarget"){var d=document.getElementById("tdate").value,v=Number(document.getElementById("tval").value);if(d){state.dailyTargets[d]=Math.max(0,v);save();render()}return}
  if(a==="savelecture"){saveLectureForm();return}
  if(a==="deletelecture"){deleteLecture();return}
  if(a==="clearlecture"){showLectureEditor("");return}
  if(a==="adminprev"){adminOffset=Math.max(0,adminOffset-20);render();return}
  if(a==="adminnext"){var max=Math.max(0,Math.floor(((PLANNERS[plannerSubject]||[]).length-1)/20)*20);adminOffset=Math.min(max,adminOffset+20);render();return}
  if(a==="syncdays"){shiftChapterDates();return}
  if(a==="syncfirstdate"){setChapterFirstDate();return}
  if(a==="addchapter"){var cs=document.getElementById("chsub").value,cn=document.getElementById("chname").value.trim();if(!cn)return alert("Enter a chapter name.");if(!state.customChapters[cs])state.customChapters[cs]=[];if(!state.customChapters[cs].includes(cn))state.customChapters[cs].push(cn);save();render();return}
  if(a==="removechapter"){var rs=document.getElementById("rchsub").value,rn=document.getElementById("rchname").value.trim();if(!rn)return alert("Enter the exact chapter name.");var exists=PLANNERS[rs].some(function(x){return x.chapter===rn});if(exists&&!confirm("Delete ALL lectures in "+rn+" from "+rs+"?"))return;PLANNERS[rs]=PLANNERS[rs].filter(function(x){return x.chapter!==rn});state.customChapters[rs]=(state.customChapters[rs]||[]).filter(function(x){return x!==rn});save();render();return}
  if(a==="renamechapter"){var rs=document.getElementById("rnsub").value,oldn=document.getElementById("rnold").value.trim(),newn=document.getElementById("rnnew").value.trim();if(!oldn||!newn)return alert("Enter both current and new chapter names.");var changed=false;(PLANNERS[rs]||[]).forEach(function(x){if(x.chapter===oldn){x.chapter=newn;changed=true}});state.customChapters[rs]=(state.customChapters[rs]||[]).map(function(x){return x===oldn?newn:x});if(!changed&&!state.customChapters[rs].includes(newn))return alert("Chapter not found.");save();render();return}
  if(a==="saveactualrelease"){
    if(!state.actualReleased.Physics)state.actualReleased.Physics={};
    if(!state.actualCompletedExtra.Physics)state.actualCompletedExtra.Physics={};
    document.querySelectorAll('[data-released-chapter]').forEach(function(el){var ch=el.dataset.releasedChapter;state.actualReleased.Physics[ch]=Math.max(0,Number(el.value)||0)});
    document.querySelectorAll('[data-extra-completed]').forEach(function(el){var ch=el.dataset.extraCompleted;state.actualCompletedExtra.Physics[ch]=Math.max(0,Number(el.value)||0)});
    save();render();return}
  if(a==="savepc"){state.physical.forEach(function(x){var t=document.querySelector('[data-pctotal="'+x.id+'"]'),d=document.querySelector('[data-pcdone="'+x.id+'"]');x.total=Math.max(0,Number(t.value)||0);x.done=Math.max(0,Math.min(x.total,Number(d.value)||0))});save();render();return}
  if(a==="addextra"){var n=document.getElementById("newextra").value.trim();if(n){state.extra.push({id:uid(),name:n,hours:Number(document.getElementById("newhours").value)||1,done:false,note:""});save();render()}return}
  if(a==="savens"){state.mathNCERT.forEach(function(x){var e=document.querySelector('[data-ncert="'+x.id+'"]');if(e)x.progress=Math.max(0,Math.min(100,Number(e.value)||0))});save();render();return}
  if(a==="addtest"){var n=document.getElementById("testname").value.trim(),x=Number(document.getElementById("testx").value),m=Number(document.getElementById("testm").value);if(n&&x){state.tests.push({name:n,date:document.getElementById("testdate").value,m:m,x:x});save();render()}return}
  if(a==="export"){exportData();return}
  if(a==="reset"){if(confirm("Reset ONLY this new tracker data? Your older lav_tracker_v2 data will remain in localStorage.")){localStorage.removeItem("lav_tracker_v4");location.reload()}return}
}

    field("Lecture date","modal_ldate",l?l.date:todayISO(),"date")+
    '<label>Chapter</label><select id="modal_lchap">'+chapterOptions(subject,chapter)+'</select>'+
    field("Lecture number","modal_lnum",l?l.lecture:nextLectureNumber(subject,chapter),"number")+field("Lecture title","modal_ltitle",l?l.title:"")+
    '<div class="row" style="margin-top:12px"><button class="primary" id="modal_save">Save Lecture</button>'+(l?'<button class="danger" id="modal_delete">Delete Lecture</button>':'')+'<button class="secondary" id="modal_cancel">Cancel</button></div>'+
    '<p class="tiny muted">Change the date if the real batch is behind/ahead of the PDF. Change chapter if the batch has moved to a different chapter.</p></div>';
  document.body.appendChild(ov);
  document.getElementById("closeLectureEditor").addEventListener("click",closeLectureEditor);
  document.getElementById("modal_cancel").addEventListener("click",closeLectureEditor);
  document.getElementById("modal_lsub").addEventListener("change",function(){
    var ns=this.value, sel=document.getElementById("modal_lchap");
    var first=chapterOptions(ns,"");
    sel.innerHTML=first||'<option value="">No chapter yet — add one in Admin</option>';
    if(!l && sel.options.length){sel.selectedIndex=0;document.getElementById("modal_lnum").value=nextLectureNumber(ns,sel.value)}
  });
  document.getElementById("modal_lchap").addEventListener("change",function(){
    if(!l)document.getElementById("modal_lnum").value=nextLectureNumber(document.getElementById("modal_lsub").value,this.value);
  });
  document.getElementById("modal_save").addEventListener("click",function(){saveModalLecture()});
  var del=document.getElementById("modal_delete");if(del)del.addEventListener("click",function(){deleteModalLecture()});
}
function closeLectureEditor(){var ov=document.getElementById("lectureEditorOverlay");if(ov)ov.remove()}
function editLectureForm(id){showLectureEditor(id)}
function saveModalLecture(){
  var id=document.getElementById("modal_lid").value, subject=document.getElementById("modal_lsub").value,date=document.getElementById("modal_ldate").value,chapter=document.getElementById("modal_lchap").value.trim(),lecture=Number(document.getElementById("modal_lnum").value),title=document.getElementById("modal_ltitle").value.trim();
  if(!date||!chapter||!title||!lecture){alert("Date, chapter, lecture number and title are required.");return}
  if(id){
    var old=findLecture(id);if(!old){alert("Lecture not found.");return}
    var updated={id:old.id,subject:subject,date:date,chapter:chapter,lecture:lecture,title:title};
    Object.keys(PLANNERS).forEach(function(s){PLANNERS[s]=PLANNERS[s].filter(function(x){return x.id!==id})});
    PLANNERS[subject].push(updated);
  }else{PLANNERS[subject].push({id:uid(),subject:subject,date:date,chapter:chapter,lecture:lecture,title:title})}
  Object.keys(PLANNERS).forEach(function(s){PLANNERS[s].sort(function(a,b){return a.date.localeCompare(b.date)||Number(a.lecture)-Number(b.lecture)})});
  save();closeLectureEditor();render();
}
function saveLectureForm(){saveModalLecture()}
function deleteModalLecture(){
  var id=document.getElementById("modal_lid").value;if(!id)return;
  if(!confirm("Delete this lecture permanently from the planner?"))return;
  Object.keys(PLANNERS).forEach(function(s){PLANNERS[s]=PLANNERS[s].filter(function(x){return x.id!==id})});delete state.completed[id];save();closeLectureEditor();render();
}
function quickDeleteLecture(id){
  var l=findLecture(id);if(!l)return;if(!confirm("Delete L"+l.lecture+" • "+l.title+"?"))return;
  Object.keys(PLANNERS).forEach(function(s){PLANNERS[s]=PLANNERS[s].filter(function(x){return x.id!==id})});delete state.completed[id];save();render();
}
function deleteLecture(){deleteModalLecture()}
function clearLectureForm(){showLectureEditor("")}
function syncChapterOptions(){
  var s=document.getElementById("syncsub");var c=document.getElementById("syncchap");if(!s||!c)return;var groups=chapterGroups(s.value);c.innerHTML=groups.map(function(g){return '<option>'+esc(g.chapter)+'</option>'}).join('');
}
function selectedSyncRows(){
  var s=document.getElementById("syncsub").value,ch=document.getElementById("syncchap").value;
  return (PLANNERS[s]||[]).filter(function(x){return x.chapter===ch}).sort(function(a,b){return Number(a.lecture)-Number(b.lecture)||a.date.localeCompare(b.date)});
}
function shiftChapterDates(){
  var rows=selectedSyncRows(),days=Number(document.getElementById("syncdays").value)||0;if(!rows.length)return alert("No lectures found in this chapter.");if(!days)return alert("Enter a non-zero number of days, e.g. +14 or -7.");
  if(!confirm("Shift all "+rows.length+" lectures in this chapter by "+days+" day(s)?"))return;
  rows.forEach(function(l){var d=new Date(l.date+"T12:00:00");d.setDate(d.getDate()+days);l.date=d.toISOString().slice(0,10)});save();render();
}
function setChapterFirstDate(){
  var rows=selectedSyncRows(),target=document.getElementById("syncdate").value;if(!rows.length)return alert("No lectures found in this chapter.");if(!target)return alert("Choose the actual first lecture date.");
  rows.sort(function(a,b){return Number(a.lecture)-Number(b.lecture)||a.date.localeCompare(b.date)});
  var base=new Date(rows[0].date+"T12:00:00"),want=new Date(target+"T12:00:00");var delta=Math.round((want-base)/86400000);
  if(!delta)return alert("The first lecture is already on that date.");
  if(!confirm("Move this chapter's schedule by "+delta+" day(s) while preserving lecture gaps?"))return;
  rows.forEach(function(l){var d=new Date(l.date+"T12:00:00");d.setDate(d.getDate()+delta);l.date=d.toISOString().slice(0,10)});save();render();
}
function exportData(){
  var payload={exported_at:new Date().toISOString(),state:state,planner_data:PLANNERS};
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="Lav_Class12_Tracker_Backup_"+todayISO()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
}
function importFile(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){try{var p=JSON.parse(r.result);if(!p.state||!p.planner_data)throw Error("Invalid backup");if(!confirm("Import this backup and replace current tracker state?"))return;state=p.state;Object.keys(p.planner_data).forEach(function(s){PLANNERS[s]=p.planner_data[s]});save();render();alert("Import complete.")}catch(err){alert("Import failed: "+err.message)}};r.readAsText(f);
}
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(function(){})}
render();
</script>
<script>
(function(){
  try {
    var code = document.getElementById("app-code").textContent;
    Function(code)();
  } catch (e) {
    var a=document.getElementById("app");
    a.innerHTML='<div class="card priority"><b>Tracker startup error</b><pre style="white-space:pre-wrap;overflow:auto">'+String(e&&e.stack?e.stack:e)+'</pre></div>';
  }
})();
</script>
